services:
  postgres:
    image: postgres:16
    container_name: ai-content-os-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - ai_content_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_content_os -d ai_content_os"]
      interval: 5s
      timeout: 5s
      retries: 8

volumes:
  ai_content_os_pgdata:
